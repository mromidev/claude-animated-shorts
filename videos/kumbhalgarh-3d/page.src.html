<script type="module">

{

const gate = new THREE.Group(); gate.position.copy(GATE); scene.add(gate);
{
  const s = new THREE.Shape(); s.moveTo(-10, -3); s.lineTo(10, -3); s.lineTo(10, 17); s.lineTo(-10, 17); s.lineTo(-10, -3);
  const hole = new THREE.Path(); hole.moveTo(-3.6, -3); hole.lineTo(3.6, -3); hole.lineTo(3.6, 5.5); hole.quadraticCurveTo(3.4, 9.4, 0, 11); hole.quadraticCurveTo(-3.4, 9.4, -3.6, 5.5); hole.lineTo(-3.6, -3); s.holes.push(hole);

const chapterAt = (t) => { let i = 0; while (i < CH.length - 1 && t >= CH[i + 1] - .45) i++; return i; };
